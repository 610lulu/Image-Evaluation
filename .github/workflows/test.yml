name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      # CI intentionally uses mock mode: no API key, deterministic, zero model cost.
      - run: PYTHONPATH=src python -m image_evaluation.runner --agent mock
      - run: PYTHONPATH=src python -m image_evaluation.benchmark --agents mock
